<script>
(function () {
  "use strict";

  var payload;
  try { payload = JSON.parse(document.getElementById("payload").textContent); } 
  catch (e) { document.body.innerHTML = '<div style="padding:40px;text-align:center;">数据损坏</div>'; return; }

  var zipBytes = null;
  var zipEntries = [];
  var entryMap = {};
  var selected = new Set();
  var activeFile = null;
  var treeData = null;
  var searchQuery = "";

  var loginOverlay = document.getElementById("loginOverlay");
  var treeContainer = document.getElementById("treeContainer");
  var previewHeader = document.getElementById("previewHeader");
  var previewTitle = document.getElementById("previewTitle");
  var previewBody = document.getElementById("previewBody");

  // ================= 按需动态加载库 =================
  var loadedScripts = {};
  function loadScript(src) {
    if (loadedScripts[src]) return loadedScripts[src];
    loadedScripts[src] = new Promise(function(resolve, reject) {
      var script = document.createElement("script");
      script.src = src;
      script.onload = resolve;
      script.onerror = function() {
        delete loadedScripts[src]; // 失败允许重试
        reject(new Error("网络加载失败: " + src));
      };
      document.head.appendChild(script);
    });
    return loadedScripts[src];
  }

  async function ensureHighlight() {
    if (typeof hljs === 'undefined') {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js");
    }
  }
  async function ensureMarked() {
    if (typeof marked === 'undefined') {
      await loadScript("https://cdn.jsdelivr.net/npm/marked/marked.min.js");
    }
  }
  async function ensureMammoth() {
    if (typeof mammoth === 'undefined') {
      await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js");
    }
  }
  async function ensureXLSX() {
    if (typeof XLSX === 'undefined') {
      await loadScript("https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js");
    }
  }
  // =================================================

  // ---- 格式分类字典 (所有以数字开头或带特殊字符的键名必须加引号) ----
  var imgExts = new Set(["png","jpg","jpeg","gif","webp","svg","bmp","ico","avif","apng","tiff"]);
  var videoExts = new Set(["mp4","webm","ogg","ogv","mov","m4v","3gp","3g2"]);
  var audioExts = new Set(["mp3","wav","ogg","flac","m4a","aac","opus","weba","mid","midi"]);
  var sheetExts = new Set(["xlsx", "xls", "csv", "ods", "fods"]);
  var docExts = new Set(["docx"]); 
  var fontExts = new Set(["ttf","otf","woff","woff2"]);
  var archiveExts = new Set(["zip","rar","7z","tar","gz","bz2","xz","iso","dmg"]);
  var binaryExts = new Set(["exe","dll","so","dylib","bin","dat","db","sqlite","class","jar","war","pyc","obj","o","a","lib"]);
  
  var textExts = new Set([
    "html","htm","css","scss","less","sass","js","jsx","ts","tsx","json","json5","vue","svelte","astro",
    "py","java","cs","c","cpp","h","hpp","cc","go","rs","rb","php","sh","bash","zsh","fish","ps1","bat","cmd","lua","pl","r","swift","kt","kts","scala","dart","sql","groovy","gradle",
    "xml","yaml","yml","toml","ini","conf","properties","env","csv","tsv",
    "txt","log","md","markdown","rst","tex","diff","patch","gitignore","dockerignore","editorconfig"
  ]);

  // 初始化
  document.getElementById("appName").textContent = payload.displayName || "归档文件";
  document.getElementById("appMeta").textContent = (payload.fileCount || 0) + " 个文件 · " + formatSize(payload.originalSize);

  if (payload.isEncrypted === false) {
    var b64 = payload.chunks[0];
    var bytes = b64ToBytes(b64);
    initApp(bytes);
  } else {
    loginOverlay.classList.remove("hidden");
    document.getElementById("btnLogin").onclick = doDecrypt;
    document.getElementById("pwdInput").onkeydown = function(e) { if(e.key === "Enter") doDecrypt(); };
  }

  async function doDecrypt() {
    var pwd = document.getElementById("pwdInput").value;
    if (!pwd) return;
    var err = document.getElementById("loginError");
    err.style.display = "none";
    var btn = document.getElementById("btnLogin");
    btn.textContent = "解密中...";
    btn.disabled = true;
    
    try {
      var enc = new TextEncoder();
      var salt = b64ToBytes(payload.salt);
      var baseNonce = b64ToBytes(payload.baseNonce);
      var km = await crypto.subtle.importKey("raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: payload.iterations, hash: "SHA-256" },
        km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      
      var parts = [];
      var total = payload.chunks.length;
      var nonceBuf = new ArrayBuffer(12);
      var dv = new DataView(nonceBuf);
      var nonceView = new Uint8Array(nonceBuf);
      
      for (var i = 0; i < total; i++) {
        nonceView.set(baseNonce, 0);
        dv.setUint32(8, i, false);
        var data = b64ToBytes(payload.chunks[i]);
        var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonceBuf }, key, data);
        parts.push(new Uint8Array(plain));
      }
      var bytes = concatU8(parts);
      loginOverlay.classList.add("hidden");
      initApp(bytes);
    } catch (e) {
      err.textContent = "密码错误或数据损坏";
      err.style.display = "block";
      btn.textContent = "解密并预览";
      btn.disabled = false;
    }
  }

  function initApp(bytes) {
    zipBytes = bytes;
    var rawEntries = parseZip(bytes).filter(function(e) { return !e.isDirectory; });
    entryMap = {};
    rawEntries.forEach(function(e) { entryMap[e.name] = e; });
    zipEntries = rawEntries;
    buildTree();
    renderTree();
    updateStats();
  }

  // ---- 工具函数 ----
  function formatSize(n) {
    if (!n) return "0 B";
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n.toFixed(0) : n.toFixed(n >= 100 ? 0 : (n >= 10 ? 1 : 2))) + " " + u[i];
  }
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function concatU8(arrs) {
    var total = 0; for (var i = 0; i < arrs.length; i++) total += arrs[i].length;
    var out = new Uint8Array(total); var off = 0;
    for (var j = 0; j < arrs.length; j++) { out.set(arrs[j], off); off += arrs[j].length; }
    return out;
  }
  
  function getExt(name) { 
    var b = name.split("/").pop(); 
    var i = b.lastIndexOf("."); 
    return i < 0 ? b.toLowerCase() : b.slice(i+1).toLowerCase(); 
  }

  function getLangHint(ext, name) {
    var lowerName = name.toLowerCase();
    if (ext === "dockerfile" || lowerName === "dockerfile") return "dockerfile";
    if (ext === "makefile" || lowerName === "makefile") return "makefile";
    if (["js", "jsx"].includes(ext)) return "javascript";
    if (["ts", "tsx"].includes(ext)) return "typescript";
    if (ext === "py") return "python";
    if (ext === "cs") return "csharp";
    if (["cpp", "cc", "hpp"].includes(ext)) return "cpp";
    if (ext === "h") return "c";
    if (["sh", "bash", "zsh", "fish"].includes(ext)) return "bash";
    if (ext === "ps1") return "powershell";
    if (ext === "yml" || ext === "yaml") return "yaml";
    if (ext === "htm" || ext === "html") return "xml"; 
    return ext;
  }
  
  function getIcon(name) {
    var e = getExt(name);
    var map = { 
      "png":"🖼️","jpg":"🖼️","jpeg":"🖼️","gif":"🖼️","webp":"🖼️","svg":"🖼️","bmp":"🖼️","ico":"🖼️",
      "mp4":"🎬","webm":"🎬","mov":"🎬","ogv":"🎬","3gp":"🎬",
      "mp3":"🎵","wav":"🎵","ogg":"🎵","flac":"🎵","m4a":"🎵","aac":"🎵",
      "pdf":"📕","doc":"📘","docx":"📘","xls":"📗","xlsx":"📗","csv":"📗","ppt":"📙","pptx":"📙",
      "ttf":"🔤","otf":"🔤","woff":"🔤","woff2":"🔤",
      "txt":"📄","md":"📝","json":"🧾","xml":"🧾","html":"🌐","css":"🎨",
      "js":"💛","ts":"💙","py":"🐍","java":"☕","cs":"🟣","go":"🔵","rs":"🦀","c":"⚙️","cpp":"⚙️","h":"⚙️","sh":"💻",
      "zip":"🗜️","rar":"🗜️","7z":"🗜️","tar":"🗜️","gz":"🗜️"
    };
    return map[e] || "📄";
  }

  function getMime(name) {
    var e = getExt(name);
    var map = { 
      "png":"image/png","jpg":"image/jpeg","jpeg":"image/jpeg","gif":"image/gif","webp":"image/webp","svg":"image/svg+xml","bmp":"image/bmp","ico":"image/x-icon","avif":"image/avif","apng":"image/apng","tiff":"image/tiff",
      "mp4":"video/mp4","webm":"video/webm","mov":"video/quicktime","ogv":"video/ogg","m4v":"video/mp4","3gp":"video/3gpp",
      "mp3":"audio/mpeg","wav":"audio/wav","ogg":"audio/ogg","flac":"audio/flac","m4a":"audio/mp4","aac":"audio/aac","opus":"audio/opus","weba":"audio/webm",
      "pdf":"application/pdf",
      "txt":"text/plain","md":"text/markdown","json":"application/json","xml":"application/xml","html":"text/html","css":"text/css","js":"text/javascript" 
    };
    return map[e] || "application/octet-stream";
  }

  // ---- ZIP 解析 ----
  function parseZip(bytes) {
    var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var eocd = -1;
    for (var i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("不是合法的 ZIP 数据。");
    var cdEntries = view.getUint16(eocd + 10, true);
    var cdOffset  = view.getUint32(eocd + 16, true);
    var entries = [];
    var pos = cdOffset;
    var decoder = new TextDecoder("utf-8");
    for (var k = 0; k < cdEntries; k++) {
      if (view.getUint32(pos, true) !== 0x02014b50) throw new Error("ZIP 损坏。");
      var method      = view.getUint16(pos + 10, true);
      var compSize    = view.getUint32(pos + 20, true);
      var uncompSize  = view.getUint32(pos + 24, true);
      var nameLen     = view.getUint16(pos + 28, true);
      var extraLen    = view.getUint16(pos + 30, true);
      var commentLen  = view.getUint16(pos + 32, true);
      var localOffset = view.getUint32(pos + 42, true);
      var name = decoder.decode(bytes.subarray(pos + 46, pos + 46 + nameLen));
      var lhNameLen  = view.getUint16(localOffset + 26, true);
      var lhExtraLen = view.getUint16(localOffset + 28, true);
      var dataOffset = localOffset + 30 + lhNameLen + lhExtraLen;
      entries.push({ name: name, method: method, compressedSize: compSize, uncompressedSize: uncompSize, dataOffset: dataOffset, isDirectory: name.endsWith("/") });
      pos += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  async function extractEntry(zipBytes, entry) {
    var comp = zipBytes.subarray(entry.dataOffset, entry.dataOffset + entry.compressedSize);
    if (entry.method === 0) return comp.slice();
    if (entry.method === 8) {
      var ds = new DecompressionStream("deflate-raw");
      var stream = new Blob([comp]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    throw new Error("不支持的压缩方式");
  }

  // ---- 树构建与渲染 ----
  function buildTree() {
    var root = { name: "", path: "", isDir: true, expanded: true, children: [], entry: null };
    var dirs = { "": root };
    for (var i = 0; i < zipEntries.length; i++) {
      var e = zipEntries[i];
      var parts = e.name.split("/");
      var cur = root;
      var prefix = "";
      for (var j = 0; j < parts.length; j++) {
        var seg = parts[j];
        prefix = prefix ? prefix + "/" + seg : seg;
        var isLast = j === parts.length - 1;
        if (isLast) {
          cur.children.push({ name: seg, path: prefix, isDir: false, children: [], entry: e });
        } else {
          if (!dirs[prefix]) {
            dirs[prefix] = { name: seg, path: prefix, isDir: true, expanded: true, children: [], entry: null };
            cur.children.push(dirs[prefix]);
          }
          cur = dirs[prefix];
        }
      }
    }
    function sortNode(n) {
      n.children.sort(function(a, b) {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      n.children.forEach(sortNode);
    }
    sortNode(root);
    treeData = root;
  }

  function nodeMatches(node, q) {
    if (!q) return true;
    if (node.path.toLowerCase().indexOf(q) >= 0) return true;
    return node.children.some(function(c) { return nodeMatches(c, q); });
  }

  function collectFiles(node, out) {
    if (!node.isDir && node.entry) out.push(node.path);
    node.children.forEach(function(c) { collectFiles(c, out); });
    return out;
  }

  function renderTree() {
    var html = "";
    function walk(node, depth) {
      node.children.forEach(function(child) {
        if (!nodeMatches(child, searchQuery)) return;
        var isDir = child.isDir;
        var padding = 10 + depth * 16;
        var activeCls = (activeFile === child.path) ? " active" : "";
        
        var checkHtml = "";
        if (isDir) {
          var files = collectFiles(child, []);
          var allChecked = files.length > 0 && files.every(function(f) { return selected.has(f); });
          var someChecked = files.some(function(f) { return selected.has(f); });
          checkHtml = '<input type="checkbox" data-path="' + child.path + '" data-type="dir" ' + (allChecked ? "checked" : "") + (someChecked && !allChecked ? "data-indeterminate='1'" : "") + '>';
        } else {
          checkHtml = '<input type="checkbox" data-path="' + child.path + '" data-type="file" ' + (selected.has(child.path) ? "checked" : "") + '>';
        }

        html += '<div class="tree-row' + activeCls + '" data-path="' + child.path + '" data-type="' + (isDir ? 'dir' : 'file') + '" style="padding-left:' + padding + 'px">';
        html += checkHtml;
        if (isDir) {
          html += '<span class="chevron" style="transform:rotate(' + (child.expanded ? 90 : 0) + 'deg)">▶</span>';
          html += '<span class="icon">' + (child.expanded ? "📂" : "📁") + '</span>';
        } else {
          html += '<span class="chevron" style="visibility:hidden">▶</span>';
          html += '<span class="icon">' + getIcon(child.path) + '</span>';
        }
        html += '<span class="name" title="' + child.path + '">' + child.name + '</span>';
        if (isDir) {
          html += '<span class="size">' + collectFiles(child, []).length + ' 项</span>';
        } else if (child.entry) {
          html += '<span class="size">' + formatSize(child.entry.uncompressedSize) + '</span>';
        }
        html += '</div>';
        
        if (isDir && child.expanded) walk(child, depth + 1);
      });
    }
    walk(treeData, 0);
    treeContainer.innerHTML = html;
    treeContainer.querySelectorAll("input[data-indeterminate='1']").forEach(function(el) { el.indeterminate = true; });
  }

  function findNode(root, path) {
    if (!root) return null;
    for (var i = 0; i < root.children.length; i++) {
      if (root.children[i].path === path) return root.children[i];
      var r = findNode(root.children[i], path);
      if (r) return r;
    }
    return null;
  }

  document.getElementById("searchInput").oninput = function(e) {
    searchQuery = e.target.value.toLowerCase();
    renderTree();
  };

  treeContainer.onclick = function(e) {
    var row = e.target.closest(".tree-row");
    if (!row) return;
    var path = row.dataset.path;
    var isDir = row.dataset.type === 'dir';

    if (e.target.tagName === 'INPUT') {
      var checked = e.target.checked;
      if (isDir) {
        var node = findNode(treeData, path);
        if (node) {
          var files = collectFiles(node, []);
          files.forEach(function(f) { checked ? selected.add(f) : selected.delete(f); });
        }
      } else {
        checked ? selected.add(path) : selected.delete(path);
      }
      renderTree();
      updateStats();
      return;
    }

    if (isDir) {
      var n = findNode(treeData, path);
      if (n) { n.expanded = !n.expanded; renderTree(); }
      return;
    }

    activeFile = path;
    renderTree();
    previewFile(path);
  };

  function updateStats() {
    var btn = document.getElementById("btnExportZip");
    btn.disabled = selected.size === 0;
    btn.textContent = selected.size > 0 ? "导出选中 (" + selected.size + ")" : "导出选中";
  }

  document.getElementById("btnSelectAll").onclick = function() {
    selected = new Set(zipEntries.map(function(e) { return e.name; }));
    renderTree(); updateStats();
  };
  document.getElementById("btnSelectNone").onclick = function() {
    selected.clear(); renderTree(); updateStats();
  };

  // ---- 核心预览逻辑 ----
  async function previewFile(path) {
    var entry = entryMap[path];
    if (!entry) return;
    previewHeader.style.display = "flex";
    previewTitle.textContent = path;
    previewBody.innerHTML = '<div class="empty-state"><div class="spinner"></div><div>正在解析文件...</div></div>';
    
    try {
      var data = await extractEntry(zipBytes, entry);
      var ext = getExt(path);
      var mime = getMime(path);
      var fileName = path.split("/").pop();

      // 1. 图片
      if (imgExts.has(ext)) {
        var url = URL.createObjectURL(new Blob([data], { type: mime }));
        previewBody.innerHTML = '<img class="preview-img" src="' + url + '" onerror="this.parentNode.innerHTML=\'<div class=empty-state><div>浏览器不支持该图片格式解码</div></div>\'" />';
      } 
      // 2. 视频
      else if (videoExts.has(ext)) {
        var url = URL.createObjectURL(new Blob([data], { type: mime }));
        previewBody.innerHTML = '<video class="preview-video" src="' + url + '" controls autoplay onerror="this.parentNode.innerHTML=\'<div class=empty-state><div>浏览器不支持该视频格式解码</div><button class=btn onclick=document.getElementById(\\\'btnDownloadFile\\\').click()>下载查看</button></div>\'"></video>';
      } 
      // 3. 音频
      else if (audioExts.has(ext)) {
        var url = URL.createObjectURL(new Blob([data], { type: mime }));
        previewBody.innerHTML = '<audio class="preview-audio" src="' + url + '" controls autoplay onerror="this.parentNode.innerHTML=\'<div class=empty-state><div>浏览器不支持该音频格式解码</div><button class=btn onclick=document.getElementById(\\\'btnDownloadFile\\\').click()>下载查看</button></div>\'"></audio>';
      } 
      // 4. PDF
      else if (ext === "pdf") {
        var url = URL.createObjectURL(new Blob([data], { type: "application/pdf" }));
        previewBody.innerHTML = '<iframe class="preview-iframe" src="' + url + '"></iframe>';
      }
      // 5. Markdown
      else if (ext === "md" || ext === "markdown") {
        await ensureMarked();
        await ensureHighlight();
        var text = new TextDecoder("utf-8").decode(data);
        var html = marked.parse(text);
        previewBody.innerHTML = '<div class="markdown-body">' + html + '</div>';
        previewBody.querySelectorAll('pre code').forEach(function(block) {
          hljs.highlightElement(block);
        });
      }
      // 6. Word 文档
      else if (docExts.has(ext)) {
        await ensureMammoth();
        var result = await mammoth.convertToHtml({ arrayBuffer: data.buffer });
        previewBody.innerHTML = '<div class="docx-body">' + result.value + '</div>';
      }
      // 7. Excel / 表格
      else if (sheetExts.has(ext)) {
        await ensureXLSX();
        var workbook = XLSX.read(data, { type: 'array' });
        var html = '<div class="xlsx-container">';
        workbook.SheetNames.forEach(function(sheetName) {
          var sheet = workbook.Sheets[sheetName];
          var tableHtml = XLSX.utils.sheet_to_html(sheet);
          html += '<div class="xlsx-sheet-title">📄 ' + sheetName + '</div>';
          html += '<div class="table-wrapper">' + tableHtml + '</div>';
        });
        html += '</div>';
        previewBody.innerHTML = html;
      }
      // 8. HTML 网页预览 (沙盒)
      else if (ext === "html" || ext === "htm") {
        var url = URL.createObjectURL(new Blob([data], { type: "text/html" }));
        previewBody.innerHTML = '<iframe class="preview-iframe" src="' + url + '" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>';
      }
      // 9. 字体预览
      else if (fontExts.has(ext)) {
        var url = URL.createObjectURL(new Blob([data], { type: "font/" + ext }));
        var fontName = "PreviewFont_" + Date.now();
        var style = document.createElement('style');
        style.textContent = `
            @font-face { font-family: '${fontName}'; src: url('${url}'); }
            .font-preview-box { font-family: '${fontName}'; font-size: 36px; line-height: 1.5; word-break: break-all; padding: 40px; background: var(--sidebar-bg); border-radius: 12px; border: 1px solid var(--border); animation: popIn 0.3s ease; }
            .font-preview-title { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; font-family: sans-serif; }
        `;
        document.head.appendChild(style);
        previewBody.innerHTML = `
            <div style="max-width: 800px; margin: 0 auto;">
                <div class="font-preview-title">字体效果预览 (${ext.toUpperCase()})</div>
                <div class="font-preview-box">
                    永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。<br>
                    The quick brown fox jumps over the lazy dog.<br>
                    1234567890 !@#$%^&*()
                </div>
            </div>
        `;
      }
      // 10. 纯文本 / 代码 (防卡死限制 5MB)
      else if (textExts.has(ext) || (!ext && !binaryExts.has(ext) && !archiveExts.has(ext))) {
        if (data.length > 5 * 1024 * 1024) {
          previewBody.innerHTML = '<div class="empty-state"><div>文件过大 (>5MB)，请下载查看</div><button class="btn btn-outline" onclick="document.getElementById(\'btnDownloadFile\').click()">下载文件</button></div>';
        } else {
          await ensureHighlight();
          var text = new TextDecoder("utf-8").decode(data);
          var pre = document.createElement("pre");
          pre.className = "preview-code";
          var code = document.createElement("code");
          
          var lang = getLangHint(ext, fileName);
          if (lang) code.className = "language-" + lang;
          
          code.textContent = text;
          pre.appendChild(code);
          previewBody.innerHTML = "";
          previewBody.appendChild(pre);
          hljs.highlightElement(code);
        }
      } 
      // 11. 其他压缩包、二进制或不支持的文件
      else {
        var iconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>`;
        var hint = "此文件为二进制或暂不支持预览";
        if (archiveExts.has(ext)) hint = "压缩包文件，请下载解压查看";
        else if (ext === "doc" || ext === "xls" || ext === "ppt") hint = "不支持旧版 Office 格式，请下载查看或转换格式";
        else if (binaryExts.has(ext)) hint = "可执行文件或二进制数据，无法预览";
        
        previewBody.innerHTML = `
          <div class="empty-state">
            ${iconSvg}
            <div>${hint}</div>
            <button class="btn btn-outline" onclick="document.getElementById('btnDownloadFile').click()">下载到本地</button>
          </div>`;
      }
    } catch (err) {
      previewBody.innerHTML = '<div class="empty-state" style="color:var(--danger)"><div>解析或渲染失败</div><div style="font-size:12px;margin-top:8px;">' + err.message + '</div></div>';
    }
  }

  document.getElementById("btnDownloadFile").onclick = async function() {
    if (!activeFile) return;
    var entry = entryMap[activeFile];
    if (!entry) return;
    var data = await extractEntry(zipBytes, entry);
    var url = URL.createObjectURL(new Blob([data]));
    var a = document.createElement("a");
    a.href = url; a.download = activeFile.split("/").pop();
    a.click(); URL.revokeObjectURL(url);
  };

  // ---- 导出与 ZIP 打包 ----
  document.getElementById("btnExportZip").onclick = async function() {
    if (selected.size === 0) return;
    var arr = [];
    var files = Array.from(selected);
    var btn = this;
    var orig = btn.textContent;
    
    try {
      btn.disabled = true;
      for (var i = 0; i < files.length; i++) {
        btn.textContent = "打包中... " + (i+1) + "/" + files.length;
        var e = entryMap[files[i]];
        if (!e) continue;
        var data = await extractEntry(zipBytes, e);
        arr.push({ name: e.name, data: data });
        await new Promise(function(r) { setTimeout(r, 0); });
      }
      var blob = buildZip(arr);
      var name = (payload.displayName || "archive").replace(/\.[^.]+$/, "") + "_selected.zip";
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      a.click(); URL.revokeObjectURL(url);
    } catch(e) {
      alert("打包失败：" + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  };

  var crcTable = null;
  function crc32(data) {
    if (!crcTable) {
      crcTable = new Uint32Array(256);
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = c & 1 ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        crcTable[n] = c >>> 0;
      }
    }
    var crc = 0 ^ (-1);
    for (var i = 0; i < data.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ data[i]) & 0xFF];
    return (crc ^ (-1)) >>> 0;
  }

  function buildZip(files) {
    var encoder = new TextEncoder();
    var chunks = [], cdParts = [], offset = 0;
    for (var i = 0; i < files.length; i++) {
      var nameBytes = encoder.encode(files[i].name);
      var data = files[i].data;
      var crc = crc32(data);
      var size = data.length;

      var lfh = new Uint8Array(30 + nameBytes.length);
      var lv = new DataView(lfh.buffer);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
      lv.setUint32(14, crc, true); lv.setUint32(18, size, true); lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lfh.set(nameBytes, 30);
      chunks.push(lfh, data);

      var cde = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(cde.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true); cv.setUint32(16, crc, true); cv.setUint32(20, size, true);
      cv.setUint32(24, size, true); cv.setUint16(28, nameBytes.length, true); cv.setUint32(42, offset, true);
      cde.set(nameBytes, 46);
      cdParts.push(cde);

      offset += lfh.length + size;
    }
    var cdBytes = concatU8(cdParts);
    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdBytes.length, true); ev.setUint32(16, offset, true);
    return new Blob(chunks.concat([cdBytes, eocd]), { type: "application/zip" });
  }
})();
